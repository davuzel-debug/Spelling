<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Angličtina – Spelling</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }

    .card {
      font-size: 36px;
      margin: 20px;
    }

    input {
      font-size: 32px;
      padding: 12px;
      margin: 8px;
    }

    button {
      font-size: 22px;
      padding: 12px 24px;
      margin: 10px;
      cursor: pointer;
    }

    .btn-green {
      background: #4caf50;
      color: white;
    }

    .btn-yellow {
      background: #ffc107;
    }

    .btn-red {
      background: #f44336;
      color: white;
    }

    .lesson-button {
      display: block;
      width: 300px;
      margin: 12px auto;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 8px;
    }

    .lesson-button:hover {
      opacity: 0.85;
    }

    .bar {
      width: 80%;
      height: 20px;
      background: #eee;
      margin: 10px auto;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
    }

    .result-box {
      font-size: 28px;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      margin-top: 15px;
      display: inline-block;
      min-width: 220px;
    }

    .correct {
      background: #d4ffd4;
      color: green;
    }

    .wrong {
      background: #ffd4d4;
      color: red;
    }
  </style>
</head>

<body>

<h1>Procvičování angličtiny</h1>


<!-- ========================= -->
<!-- VÝBĚR LEKCE -->
<!-- ========================= -->

<div id="lessonSelect">

  <h2>Vyber spelling lekci</h2>

  <button class="lesson-button" onclick="selectLesson(1)">
    Spelling 1
  </button>

  <button class="lesson-button" onclick="selectLesson(2)">
    Spelling 2
  </button>

  <button class="lesson-button" onclick="selectLesson(3)">
    Spelling 3
  </button>

  <button class="lesson-button" onclick="selectLesson(4)">
    Spelling 4
  </button>

  <button class="lesson-button" onclick="selectLesson(5)">
    Spelling 5
  </button>

</div>


<!-- ========================= -->
<!-- VÝBĚR DÉLKY HRY -->
<!-- ========================= -->

<div id="setup" style="display:none;">

  <h2>Jak dlouhou chceš hru?</h2>

  <button class="btn-green" onclick="start(5)">
    🟢 Krátká hra (5 slov)
  </button>

  <br>

  <button class="btn-yellow" onclick="start(8)">
    🟡 Střední hra (8 slov)
  </button>

  <br>

  <button class="btn-red" onclick="start(10)">
    🔴 Dlouhá hra (10 slov)
  </button>

</div>


<!-- ========================= -->
<!-- HRA -->
<!-- ========================= -->

<div id="game" style="display:none;">

  <div class="bar">
    <div class="bar-fill" id="progress"></div>
  </div>

  <div id="progressText"></div>

  <div class="card" id="czWord"></div>

  <input type="text" id="answer">

  <br>

  <button onclick="next()">Další</button>

  <button onclick="hint()">Nápověda</button>

  <button onclick="speak(current.en)">🔊</button>

  <div id="result"></div>

</div>


<!-- ========================= -->
<!-- KONEC -->
<!-- ========================= -->

<div id="final" style="display:none;">

  <h2 id="finalText"></h2>

  <button onclick="restart()">Další</button>

</div>


<script>


// ==================================================
// 📚 SPELLING LEKCE
// ==================================================

const lessons = {

  1: [
    {cz:"mléko", en:"milk"},
    {cz:"hedvábí", en:"silk"},
    {cz:"pásek", en:"belt"},
    {cz:"roztát", en:"melt"},
    {cz:"zlato", en:"gold"},
    {cz:"řekl", en:"told"},
    {cz:"studený", en:"cold"},
    {cz:"pomoc", en:"help"},
    {cz:"chaluhy", en:"kelp"},
    {cz:"hlt", en:"gulp"}
  ],

  2: [],

  3: [],

  4: [],

  5: []

};


// ==================================================
// PROMĚNNÉ
// ==================================================

let selectedLesson = 0;

let selectedWords = [];
let current = {};
let wrongWords = [];

let correct = 0;
let index = 0;
let checked = false;
let target = 0;


// ==================================================
// VÝBĚR LEKCE
// ==================================================

function selectLesson(lessonNumber) {

  selectedLesson = lessonNumber;

  const wordsForLesson = lessons[lessonNumber];

  // Pokud lekce zatím nemá slova
  if (wordsForLesson.length === 0) {

    alert("Tato lekce zatím nemá žádná slovíčka.");

    return;
  }

  document.getElementById('lessonSelect').style.display = 'none';

  document.getElementById('setup').style.display = 'block';
}


// ==================================================
// SHUFFLE
// ==================================================

function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];
  }

  return array;
}


// ==================================================
// VÝBĚR DÉLKY HRY
// ==================================================

function start(count) {

  const wordsForLesson = lessons[selectedLesson];

  // Pokud je v lekci méně slov než požadovaný počet,
  // použijeme všechna dostupná slova.
  const numberOfWords =
    Math.min(count, wordsForLesson.length);

  selectedWords =
    shuffle([...wordsForLesson]).slice(0, numberOfWords);

  target = numberOfWords;

  wrongWords = [];

  index = 0;

  correct = 0;

  checked = false;

  document.getElementById('setup').style.display = 'none';

  document.getElementById('game').style.display = 'block';

  document.getElementById('final').style.display = 'none';

  next();
}


// ==================================================
// PROGRESS
// ==================================================

function updateUI() {

  document.getElementById('progressText').innerText =
    `${correct} / ${target}`;

  document.getElementById('progress').style.width =
    (correct / target * 100) + '%';
}


// ==================================================
// KONEC HRY
// ==================================================

function finish() {

  document.getElementById('game').style.display = 'none';

  document.getElementById('final').style.display = 'block';

  let text =
    `Well done Teo! You have done a great job and just learned ${target} new words! 🎉`;

  document.getElementById('finalText').innerText = text;

  speak(text);
}


// ==================================================
// NOVÁ HRA
// ==================================================

function restart() {

  document.getElementById('final').style.display = 'none';

  document.getElementById('lessonSelect').style.display = 'block';
}


// ==================================================
// DALŠÍ SLOVO / KONTROLA ODPOVĚDI
// ==================================================

function next() {

  let input =
    document
      .getElementById('answer')
      .value
      .toLowerCase()
      .trim();


  // Kontrola právě zobrazeného slova
  if (current.en && !checked) {

    if (input === current.en.toLowerCase()) {

      correct++;

      document.getElementById('result').innerHTML =
        `<div class="result-box correct">
          ✔ Správně!
        </div>`;

      wrongWords =
        wrongWords.filter(w => w.en !== current.en);

      speak(current.en);

    } else {

      document.getElementById('result').innerHTML =
        `<div class="result-box wrong">
          ❌ Správně: ${current.en}
        </div>`;

      if (!wrongWords.some(w => w.en === current.en)) {

        wrongWords.push(current);

      }

      speak(current.en);
    }

    updateUI();

    checked = true;

    return;
  }


  // Pokud jsme prošli všechna původní slova
  if (index >= selectedWords.length) {

    // Opakování chybných slov
    if (wrongWords.length > 0) {

      selectedWords = [...wrongWords];

      index = 0;

    } else {

      finish();

      return;
    }
  }


  // Zobrazení dalšího slova
  current = selectedWords[index++];

  document.getElementById('czWord').innerText =
    current.cz;

  document.getElementById('answer').value = '';

  document.getElementById('result').innerText = '';

  checked = false;

  document.getElementById('answer').focus();
}


// ==================================================
// NÁPOVĚDA
// ==================================================

function hint() {

  let w = current.en;

  if (!w) return;

  document.getElementById('result').innerText =
    w[0] + "_".repeat(w.length - 2) + w[w.length - 1];
}


// ==================================================
// VÝSLOVNOST
// ==================================================

function speak(text) {

  let u =
    new SpeechSynthesisUtterance(text);

  let v =
    speechSynthesis.getVoices();

  if (v.length === 0) {

    setTimeout(() => speak(text), 200);

    return;
  }

  u.voice =
    v.find(x => x.lang.includes('en')) || v[0];

  speechSynthesis.cancel();

  setTimeout(() => {

    speechSynthesis.speak(u);

  }, 100);
}


// ==================================================
// ENTER = DALŠÍ
// ==================================================

document
  .getElementById('answer')
  .addEventListener('keydown', e => {

    if (e.key === 'Enter') {

      next();

    }

  });


</script>

</body>
</html>
