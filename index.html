<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English Spelling</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px 20px;
      background: #ffffff;
      color: #222;
    }

    h1 {
      margin-bottom: 30px;
    }

    h2 {
      margin-bottom: 25px;
    }

    button {
      font-size: 22px;
      padding: 12px 24px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.97);
    }


    /* =========================================
       LESSON SELECTION
       ========================================= */

    .lesson-list {
      max-width: 320px;
      margin: 0 auto;
    }

    .lesson-button {
      display: block;
      width: 320px;
      max-width: 100%;
      margin: 14px auto;
      background: #2196f3;
      color: white;
      font-size: 22px;
      padding: 15px;
    }

    .lesson-button small {
      display: block;
      margin-top: 4px;
      font-size: 15px;
      opacity: 0.9;
    }


    /* =========================================
       ALL LESSON
       ========================================= */

    .lesson-separator {
      width: 320px;
      max-width: 100%;
      margin: 25px auto 5px;
      border-top: 2px solid #eeeeee;
    }

    .all-button {
      background: #f44336;
      color: white;
      margin-top: 25px;
    }

    .all-button small {
      color: white;
    }


    /* =========================================
       GAME LENGTH
       ========================================= */

    .btn-green {
      background: #4caf50;
      color: white;
    }

    .btn-yellow {
      background: #ffc107;
      color: #222;
    }

    .btn-red {
      background: #f44336;
      color: white;
    }


    /* =========================================
       BACK BUTTON
       ========================================= */

    .back-button {
      position: fixed;
      top: 15px;
      left: 15px;

      font-size: 16px;
      padding: 8px 14px;

      background: #eeeeee;
      color: #333;

      border: 1px solid #cccccc;
      border-radius: 6px;

      z-index: 10;
    }

    .back-button:hover {
      background: #dddddd;
    }


    /* =========================================
       GAME
       ========================================= */

    .game-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .progress-wrapper {
      margin: 20px auto 10px;
      width: 80%;
    }

    .bar {
      width: 100%;
      height: 20px;
      background: #eeeeee;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.3s;
    }

    #progressText {
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
    }


    /* =========================================
       WORD
       ========================================= */

    .card {
      font-size: 42px;
      font-weight: bold;
      margin: 40px 20px 25px;
    }

    #answer {
      width: 500px;
      max-width: 90%;
      font-size: 32px;
      padding: 12px;
      text-align: center;
      border: 2px solid #cccccc;
      border-radius: 8px;
    }

    #answer:focus {
      outline: none;
      border-color: #2196f3;
    }


    /* =========================================
       GAME BUTTONS
       ========================================= */

    .game-buttons {
      margin-top: 15px;
    }

    .check-button {
      background: #2196f3;
      color: white;
      font-size: 24px;
      padding: 14px 35px;
    }

    .next-button {
      background: #4caf50;
      color: white;
      font-size: 24px;
      padding: 14px 35px;
    }

    .secondary-button {
      background: #eeeeee;
      color: #333;
      font-size: 20px;
    }


    /* =========================================
       STREAK
       ========================================= */

    #streak {
      font-size: 20px;
      font-weight: bold;
      margin-top: 12px;
      min-height: 28px;
    }

    .streak-hot {
      color: #ff9800;
    }


    /* =========================================
       ANSWER RESULT
       ========================================= */

    .result-box {
      font-size: 28px;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 12px;
      margin: 20px auto;
      display: inline-block;
      min-width: 220px;
    }

    .correct {
      background: #d4ffd4;
      color: green;
    }

    .wrong {
      background: #ffd4d4;
      color: red;
    }


    /* =========================================
       HINT
       ========================================= */

    #hintText {
      font-size: 26px;
      font-weight: bold;
      margin-top: 15px;
      min-height: 35px;
      letter-spacing: 3px;
    }


    /* =========================================
       FINAL SCREEN
       ========================================= */

    .final-container {
      max-width: 600px;
      margin: 60px auto;
    }

    .final-title {
      font-size: 38px;
      margin-bottom: 30px;
    }

    .final-score {
      font-size: 32px;
      font-weight: bold;
      margin: 20px;
    }

    .final-stat {
      font-size: 22px;
      margin: 12px;
    }

    .final-buttons {
      margin-top: 30px;
    }


    /* =========================================
       MOBILE / TABLET
       ========================================= */

    @media (max-width: 600px) {

      body {
        padding: 70px 12px 20px;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 25px;
      }

      h2 {
        font-size: 24px;
      }

      .lesson-button {
        width: 100%;
        max-width: 400px;
      }

      .card {
        font-size: 36px;
        margin-top: 35px;
      }

      #answer {
        width: 100%;
        max-width: 400px;
        font-size: 28px;
      }

      .progress-wrapper {
        width: 95%;
      }

      button {
        max-width: 95%;
      }

      .check-button,
      .next-button {
        width: 90%;
        max-width: 400px;
      }

      .secondary-button {
        font-size: 18px;
      }

      .result-box {
        font-size: 24px;
        min-width: 0;
        width: 90%;
      }

      .final-title {
        font-size: 32px;
      }

      .final-score {
        font-size: 28px;
      }

      .back-button {
        font-size: 14px;
        padding: 7px 10px;
      }
    }

  </style>
</head>


<body>

<h1>English Spelling</h1>


<!-- =========================================
     LESSON SELECTION
     ========================================= -->

<div id="lessonSelect">

  <h2>Choose a spelling lesson</h2>

  <div
    id="lessonList"
    class="lesson-list">
  </div>


  <!-- ALL -->

  <div class="lesson-separator"></div>

  <button
    id="allButton"
    class="lesson-button all-button"
    onclick="selectLesson('all')">

    ALL

    <small id="allLessonCount"></small>

  </button>

</div>


<!-- =========================================
     GAME LENGTH SELECTION
     ========================================= -->

<div id="setup" style="display:none;">

  <button
    class="back-button"
    onclick="backToLessons()">

    ← Back to lessons

  </button>


  <h2 id="setupTitle">
    💪 How strong do you feel today?
  </h2>


  <!-- NORMAL LESSON -->

  <div id="normalLevels">

    <button
      id="shortButton"
      class="btn-green"
      onclick="start(5)">

      🟢 Easy – 5 words

    </button>

    <br>


    <button
      id="mediumButton"
      class="btn-yellow"
      onclick="start(10)">

      🟡 Challenge – 10 words

    </button>

    <br>

  </div>


  <!-- ALL LESSON -->

  <div
    id="allLevels"
    style="display:none;">

    <button
      id="allThirdButton"
      class="btn-green"
      onclick="startAllByPercentage(1/3)">

      🟢 Warm-up – 1/3

    </button>

    <br>


    <button
      id="allTwoThirdButton"
      class="btn-yellow"
      onclick="startAllByPercentage(2/3)">

      🟡 Challenge – 2/3

    </button>

    <br>


    <button
      id="allFullButton"
      class="btn-red"
      onclick="startAllByPercentage(1)">

      🔴 Beast mode – ALL

    </button>

  </div>


  <!-- FULL NORMAL LESSON -->

  <button
    id="fullButton"
    class="btn-red"
    onclick="startFullLesson()">

    🔴 Beast mode – Full lesson

  </button>

</div>


<!-- =========================================
     GAME
     ========================================= -->

<div id="game" style="display:none;">

  <button
    class="back-button"
    onclick="backToLessons()">

    ← Back to lessons

  </button>


  <div class="game-container">

    <div class="progress-wrapper">

      <div class="bar">

        <div
          class="bar-fill"
          id="progress">
        </div>

      </div>


      <div id="progressText"></div>

    </div>


    <div
      class="card"
      id="czWord">
    </div>


    <input
      type="text"
      id="answer"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    >


    <div class="game-buttons">

      <button
        id="checkButton"
        class="check-button"
        onclick="next()">

        Check

      </button>


      <button
        id="nextButton"
        class="next-button"
        onclick="next()"
        style="display:none;">

        Next →

      </button>


      <br>


      <button
        class="secondary-button"
        onclick="hint()">

        💡 Hint

      </button>


      <button
        class="secondary-button"
        onclick="speak(current.en)">

        🔊

      </button>

    </div>


    <div id="streak"></div>

    <div id="result"></div>

    <div id="hintText"></div>

  </div>

</div>


<!-- =========================================
     FINAL SCREEN
     ========================================= -->

<div id="final" style="display:none;">

  <button
    class="back-button"
    onclick="backToLessons()">

    ← Back to lessons

  </button>


  <div class="final-container">

    <div class="final-title">
      🎉 GREAT JOB, TEO!
    </div>


    <div
      class="final-score"
      id="finalScore">
    </div>


    <div
      class="final-stat"
      id="finalStreak">
    </div>


    <div
      class="final-stat"
      id="finalMistakes">
    </div>


    <div
      class="final-stat"
      id="finalHints">
    </div>


    <div class="final-buttons">

      <button
        class="btn-green"
        onclick="restart()">

        🔄 Try again

      </button>


      <br>


      <button
        class="secondary-button"
        onclick="backToLessons()">

        📚 Choose another lesson

      </button>

    </div>

  </div>

</div>


<script>


// ==================================================
// 📚 SPELLING LESSONS
// ==================================================
//
// Add new lessons here.
//
// Example:
//
// 2: [
//   {cz:"dům", en:"house"},
//   {cz:"pes", en:"dog"}
// ],
//
// The lesson button is created automatically.
// The words are automatically added to ALL.
//

const lessons = {

  1: [
    {cz:"mléko", en:"milk"},
    {cz:"hedvábí", en:"silk"},
    {cz:"pásek", en:"belt"},
    {cz:"roztát", en:"melt"},
    {cz:"zlato", en:"gold"},
    {cz:"řekl", en:"told"},
    {cz:"studený", en:"cold"},
    {cz:"pomoc", en:"help"},
    {cz:"chaluhy", en:"kelp"},
    {cz:"hlt", en:"gulp"}
  ]

};


// ==================================================
// ALL – ALL WORDS
// ==================================================

let allWords = [];


function buildAllWords() {

  allWords = [];

  Object.values(lessons).forEach(
    lessonWords => {

      allWords =
        allWords.concat(lessonWords);

    }
  );
}


// ==================================================
// CREATE LESSON BUTTONS
// ==================================================

function renderLessons() {

  const lessonList =
    document.getElementById(
      'lessonList'
    );


  lessonList.innerHTML = '';


  const lessonNumbers =
    Object.keys(lessons)
      .sort(
        (a, b) => Number(a) - Number(b)
      );


  lessonNumbers.forEach(
    lessonNumber => {

      const words =
        lessons[lessonNumber];


      const button =
        document.createElement('button');


      button.className =
        'lesson-button';


      button.onclick =
        () => selectLesson(
          Number(lessonNumber)
        );


      button.innerHTML =
        `Spelling ${lessonNumber}
         <small>${words.length} words</small>`;


      lessonList.appendChild(button);

    }
  );


  // ALL

  buildAllWords();


  document
    .getElementById('allLessonCount')
    .innerText =
      `${allWords.length} words`;
}


// ==================================================
// GAME VARIABLES
// ==================================================

let selectedLesson = 0;

let selectedWords = [];

let current = {};

let wrongWords = [];

let correct = 0;

let index = 0;

let checked = false;

let target = 0;

let streak = 0;

let maxStreak = 0;

let mistakeCount = 0;

let hintCount = 0;

let currentHintLevel = 0;


// ==================================================
// SELECT LESSON
// ==================================================

function selectLesson(lessonNumber) {

  selectedLesson =
    lessonNumber;


  // ----------------------------------------------
  // ALL
  // ----------------------------------------------

  if (lessonNumber === 'all') {

    buildAllWords();


    if (allWords.length === 0) {

      alert(
        "There are no words yet."
      );

      return;
    }


    const wordCount =
      allWords.length;


    document
      .getElementById('setupTitle')
      .innerText =
        "🔥 How much can you handle?";


    // Hide normal levels

    document
      .getElementById('normalLevels')
      .style.display =
        'none';


    // Show ALL levels

    document
      .getElementById('allLevels')
      .style.display =
        'block';


    // Hide Full lesson button

    document
      .getElementById('fullButton')
      .style.display =
        'none';


    // ------------------------------------------
    // CALCULATE THIRDS
    // ------------------------------------------

    const firstThird =
      Math.max(
        1,
        Math.ceil(wordCount / 3)
      );


    const twoThirds =
      Math.max(
        1,
        Math.ceil(wordCount * 2 / 3)
      );


    document
      .getElementById('allThirdButton')
      .innerText =
        `🟢 Warm-up – 1/3 (${firstThird} words)`;


    document
      .getElementById('allTwoThirdButton')
      .innerText =
        `🟡 Challenge – 2/3 (${twoThirds} words)`;


    document
      .getElementById('allFullButton')
      .innerText =
        `🔴 Beast mode – ALL (${wordCount} words)`;


    // Show setup

    document
      .getElementById('lessonSelect')
      .style.display =
        'none';


    document
      .getElementById('setup')
      .style.display =
        'block';


    return;
  }


  // ----------------------------------------------
  // NORMAL LESSON
  // ----------------------------------------------

  const wordsForLesson =
    lessons[lessonNumber];


  if (
    !wordsForLesson ||
    wordsForLesson.length === 0
  ) {

    alert(
      "This lesson has no words yet."
    );

    return;
  }


  const wordCount =
    wordsForLesson.length;


  // Show normal levels

  document
    .getElementById('normalLevels')
    .style.display =
      'block';


  // Hide ALL levels

  document
    .getElementById('allLevels')
    .style.display =
      'none';


  // Show Full lesson

  document
    .getElementById('fullButton')
    .style.display =
      'inline-block';


  document
    .getElementById('setupTitle')
    .innerText =
      "💪 How strong do you feel today?";


  // ----------------------------------------------
  // SHORT GAME – 5 WORDS
  // ----------------------------------------------

  const shortButton =
    document.getElementById(
      'shortButton'
    );


  if (wordCount >= 6) {

    shortButton.style.display =
      'inline-block';

    shortButton.innerText =
      '🟢 Easy – 5 words';

  } else {

    shortButton.style.display =
      'none';
  }


  // ----------------------------------------------
  // MEDIUM GAME – 10 WORDS
  // ----------------------------------------------

  const mediumButton =
    document.getElementById(
      'mediumButton'
    );


  if (wordCount >= 11) {

    mediumButton.style.display =
      'inline-block';

    mediumButton.innerText =
      '🟡 Challenge – 10 words';

  } else {

    mediumButton.style.display =
      'none';
  }


  // ----------------------------------------------
  // FULL LESSON
  // ----------------------------------------------

  const fullButton =
    document.getElementById(
      'fullButton'
    );


  fullButton.innerText =
    `🔴 Beast mode – Full lesson (${wordCount} words)`;


  // ----------------------------------------------
  // SHOW SETUP
  // ----------------------------------------------

  document
    .getElementById('lessonSelect')
    .style.display =
      'none';


  document
    .getElementById('setup')
    .style.display =
      'block';
}


// ==================================================
// BACK TO LESSONS
// ==================================================

function backToLessons() {

  document
    .getElementById('setup')
    .style.display =
      'none';


  document
    .getElementById('game')
    .style.display =
      'none';


  document
    .getElementById('final')
    .style.display =
      'none';


  document
    .getElementById('lessonSelect')
    .style.display =
      'block';


  // Reset game

  selectedLesson = 0;

  selectedWords = [];

  current = {};

  wrongWords = [];

  correct = 0;

  index = 0;

  checked = false;

  target = 0;

  streak = 0;

  maxStreak = 0;

  mistakeCount = 0;

  hintCount = 0;

  currentHintLevel = 0;


  // Reset UI

  document
    .getElementById('progress')
    .style.width =
      '0%';


  document
    .getElementById('progressText')
    .innerText = '';


  document
    .getElementById('czWord')
    .innerText = '';


  document
    .getElementById('answer')
    .value = '';


  document
    .getElementById('result')
    .innerText = '';


  document
    .getElementById('hintText')
    .innerText = '';


  document
    .getElementById('streak')
    .innerText = '';


  // Reset levels

  document
    .getElementById('normalLevels')
    .style.display =
      'block';


  document
    .getElementById('allLevels')
    .style.display =
      'none';


  document
    .getElementById('fullButton')
    .style.display =
      'inline-block';


  document
    .getElementById('setupTitle')
    .innerText =
      "💪 How strong do you feel today?";


  speechSynthesis.cancel();
}


// ==================================================
// SHUFFLE
// ==================================================

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [array[i], array[j]] =
      [array[j], array[i]];
  }


  return array;
}


// ==================================================
// START GAME
// ==================================================

function start(count) {

  const wordsForLesson =
    selectedLesson === 'all'
      ? allWords
      : lessons[selectedLesson];


  const numberOfWords =
    Math.min(
      count,
      wordsForLesson.length
    );


  selectedWords =
    shuffle([...wordsForLesson])
      .slice(
        0,
        numberOfWords
      );


  target =
    numberOfWords;


  wrongWords = [];

  index = 0;

  correct = 0;

  checked = false;

  streak = 0;

  maxStreak = 0;

  mistakeCount = 0;

  hintCount = 0;

  currentHintLevel = 0;


  document
    .getElementById('setup')
    .style.display =
      'none';


  document
    .getElementById('game')
    .style.display =
      'block';


  document
    .getElementById('final')
    .style.display =
      'none';


  updateUI();

  next();
}


// ==================================================
// START ALL BY PERCENTAGE
// ==================================================

function startAllByPercentage(
  percentage
) {

  buildAllWords();


  const wordCount =
    allWords.length;


  let numberOfWords =
    Math.ceil(
      wordCount * percentage
    );


  numberOfWords =
    Math.max(
      1,
      numberOfWords
    );


  start(numberOfWords);
}


// ==================================================
// START FULL LESSON
// ==================================================

function startFullLesson() {

  const wordCount =
    lessons[selectedLesson].length;


  start(wordCount);
}


// ==================================================
// UPDATE PROGRESS
// ==================================================

function updateUI() {

  document
    .getElementById('progressText')
    .innerText =
      `${correct} / ${target}`;


  document
    .getElementById('progress')
    .style.width =
      (correct / target * 100) + '%';
}


// ==================================================
// CHECK ANSWER
// ==================================================

function checkAnswer() {

  const input =
    document
      .getElementById('answer')
      .value
      .toLowerCase()
      .trim();


  // ----------------------------------------------
  // CORRECT
  // ----------------------------------------------

  if (
    input === current.en.toLowerCase()
  ) {

    correct++;

    streak++;


    if (streak > maxStreak) {

      maxStreak = streak;
    }


    document
      .getElementById('result')
      .innerHTML =
        `<div class="result-box correct">
          ✔ Correct!
        </div>`;


    wrongWords =
      wrongWords.filter(
        w => w.en !== current.en
      );


    const streakElement =
      document.getElementById(
        'streak'
      );


    if (streak >= 3) {

      streakElement.innerHTML =
        `<span class="streak-hot">
          🔥 ${streak} correct in a row!
        </span>`;

    } else {

      streakElement.innerText = '';
    }


    speak(current.en);

  }


  // ----------------------------------------------
  // WRONG
  // ----------------------------------------------

  else {

    mistakeCount++;

    streak = 0;


    document
      .getElementById('result')
      .innerHTML =
        `<div class="result-box wrong">
          ❌ Correct answer: ${current.en}
        </div>`;


    if (
      !wrongWords.some(
        w => w.en === current.en
      )
    ) {

      wrongWords.push(current);
    }


    document
      .getElementById('streak')
      .innerText = '';


    speak(current.en);
  }


  updateUI();


  checked = true;


  document
    .getElementById('checkButton')
    .style.display =
      'none';


  document
    .getElementById('nextButton')
    .style.display =
      'inline-block';


  document
    .getElementById('answer')
    .blur();
}


// ==================================================
// NEXT WORD
// ==================================================

function next() {

  if (
    current.en &&
    !checked
  ) {

    checkAnswer();

    return;
  }


  // ----------------------------------------------
  // END OF LIST
  // ----------------------------------------------

  if (
    index >= selectedWords.length
  ) {

    if (wrongWords.length > 0) {

      selectedWords =
        [...wrongWords];

      index = 0;

    } else {

      finish();

      return;
    }
  }


  // ----------------------------------------------
  // NEXT WORD
  // ----------------------------------------------

  current =
    selectedWords[index++];


  document
    .getElementById('czWord')
    .innerText =
      current.cz;


  document
    .getElementById('answer')
    .value = '';


  document
    .getElementById('result')
    .innerText = '';


  document
    .getElementById('hintText')
    .innerText = '';


  currentHintLevel = 0;

  checked = false;


  document
    .getElementById('checkButton')
    .style.display =
      'inline-block';


  document
    .getElementById('nextButton')
    .style.display =
      'none';


  document
    .getElementById('answer')
    .focus();
}


// ==================================================
// HINT
// ==================================================

function hint() {

  const word =
    current.en;


  if (!word) return;


  hintCount++;


  if (currentHintLevel === 0) {

    currentHintLevel = 2;

  } else {

    currentHintLevel++;
  }


  if (
    currentHintLevel >= word.length
  ) {

    currentHintLevel =
      word.length - 1;
  }


  let visible = '';


  for (
    let i = 0;
    i < word.length;
    i++
  ) {

    if (
      i === 0 ||
      i === word.length - 1 ||
      i < currentHintLevel
    ) {

      visible += word[i];

    } else {

      visible += '_';
    }
  }


  document
    .getElementById('hintText')
    .innerText =
      visible;
}


// ==================================================
// SPEECH
// ==================================================

function speak(text) {

  let u =
    new SpeechSynthesisUtterance(text);


  let voices =
    speechSynthesis.getVoices();


  if (voices.length === 0) {

    setTimeout(
      () => speak(text),
      200
    );

    return;
  }


  u.voice =
    voices.find(
      x => x.lang.includes('en')
    ) || voices[0];


  speechSynthesis.cancel();


  setTimeout(
    () => speechSynthesis.speak(u),
    100
  );
}


// ==================================================
// FINISH
// ==================================================

function finish() {

  document
    .getElementById('game')
    .style.display =
      'none';


  document
    .getElementById('final')
    .style.display =
      'block';


  document
    .getElementById('finalScore')
    .innerText =
      `${correct} / ${target} words completed`;


  document
    .getElementById('finalStreak')
    .innerText =
      `🔥 Best streak: ${maxStreak} correct in a row`;


  document
    .getElementById('finalMistakes')
    .innerText =
      `🔁 Wrong attempts: ${mistakeCount}`;


  document
    .getElementById('finalHints')
    .innerText =
      `💡 Hints used: ${hintCount}`;


  speak(
    'Well done Teo! Great job!'
  );
}


// ==================================================
// TRY AGAIN
// ==================================================

function restart() {

  document
    .getElementById('final')
    .style.display =
      'none';


  document
    .getElementById('setup')
    .style.display =
      'block';


  if (
    selectedLesson === 'all'
  ) {

    selectLesson('all');

  } else {

    selectLesson(selectedLesson);
  }
}


// ==================================================
// ENTER = CHECK / NEXT
// ==================================================

document
  .getElementById('answer')
  .addEventListener(
    'keydown',
    e => {

      if (e.key === 'Enter') {

        next();
      }

    }
  );


// ==================================================
// INITIALIZATION
// ==================================================

renderLessons();

</script>
