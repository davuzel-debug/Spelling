<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Angličtina – Spelling</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }

    .card {
      font-size: 36px;
      margin: 20px;
    }

    input {
      font-size: 32px;
      padding: 12px;
      margin: 8px;
    }

    button {
      font-size: 22px;
      padding: 12px 24px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    .btn-green {
      background: #4caf50;
      color: white;
    }

    .btn-yellow {
      background: #ffc107;
    }

    .btn-red {
      background: #f44336;
      color: white;
    }

    .lesson-button {
      display: block;
      width: 300px;
      margin: 12px auto;
      background: #2196f3;
      color: white;
    }

    .lesson-button:hover {
      opacity: 0.85;
    }

    /* =========================
       TLAČÍTKO ZPĚT
       ========================= */

    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;

      font-size: 16px;
      padding: 8px 14px;

      background: #eeeeee;
      color: #333;

      border: 1px solid #cccccc;
      border-radius: 6px;
    }

    .back-button:hover {
      background: #dddddd;
    }

    /* =========================
       PROGRESS BAR
       ========================= */

    .bar {
      width: 80%;
      height: 20px;
      background: #eee;
      margin: 10px auto;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
    }

    /* =========================
       VÝSLEDEK
       ========================= */

    .result-box {
      font-size: 28px;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      margin-top: 15px;
      display: inline-block;
      min-width: 220px;
    }

    .correct {
      background: #d4ffd4;
      color: green;
    }

    .wrong {
      background: #ffd4d4;
      color: red;
    }
  </style>
</head>

<body>

<h1>Procvičování angličtiny</h1>


<!-- =========================
     VÝBĚR LEKCE
     ========================= -->

<div id="lessonSelect">

  <h2>Vyber spelling lekci</h2>

  <button class="lesson-button" onclick="selectLesson(1)">
    Spelling 1
  </button>

  <button class="lesson-button" onclick="selectLesson(2)">
    Spelling 2
  </button>

  <button class="lesson-button" onclick="selectLesson(3)">
    Spelling 3
  </button>

  <button class="lesson-button" onclick="selectLesson(4)">
    Spelling 4
  </button>

  <button class="lesson-button" onclick="selectLesson(5)">
    Spelling 5
  </button>

</div>


<!-- =========================
     VÝBĚR DÉLKY HRY
     ========================= -->

<div id="setup" style="display:none;">

  <button class="back-button" onclick="backToLessons()">
    ← Zpět na výběr lekce
  </button>

  <h2>Jak dlouhou chceš hru?</h2>

  <button
    id="shortButton"
    class="btn-green"
    onclick="start(5)">
    🟢 Krátká hra – 5 slov
  </button>

  <br>

  <button
    id="mediumButton"
    class="btn-yellow"
    onclick="start(10)">
    🟡 Střední hra – 10 slov
  </button>

  <br>

  <button
    id="fullButton"
    class="btn-red"
    onclick="startFullLesson()">
    🔴 Celá lekce
  </button>

</div>


<!-- =========================
     HRA
     ========================= -->

<div id="game" style="display:none;">

  <button class="back-button" onclick="backToLessons()">
    ← Zpět na výběr lekce
  </button>

  <div class="bar">
    <div class="bar-fill" id="progress"></div>
  </div>

  <div id="progressText"></div>

  <div class="card" id="czWord"></div>

  <input type="text" id="answer">

  <br>

  <button onclick="next()">Další</button>

  <button onclick="hint()">Nápověda</button>

  <button onclick="speak(current.en)">🔊</button>

  <div id="result"></div>

</div>


<!-- =========================
     KONEC HRY
     ========================= -->

<div id="final" style="display:none;">

  <button class="back-button" onclick="backToLessons()">
    ← Zpět na výběr lekce
  </button>

  <h2 id="finalText"></h2>

  <button onclick="restart()">
    Další hra
  </button>

</div>


<script>


// ==================================================
// 📚 SPELLING LEKCE
// ==================================================

const lessons = {

  1: [
    {cz:"mléko", en:"milk"},
    {cz:"hedvábí", en:"silk"},
    {cz:"pásek", en:"belt"},
    {cz:"roztát", en:"melt"},
    {cz:"zlato", en:"gold"},
    {cz:"řekl", en:"told"},
    {cz:"studený", en:"cold"},
    {cz:"pomoc", en:"help"},
    {cz:"chaluhy", en:"kelp"},
    {cz:"hlt", en:"gulp"}
  ],

  2: [],

  3: [],

  4: [],

  5: []

};


// ==================================================
// PROMĚNNÉ
// ==================================================

let selectedLesson = 0;

let selectedWords = [];
let current = {};
let wrongWords = [];

let correct = 0;
let index = 0;
let checked = false;
let target = 0;


// ==================================================
// VÝBĚR LEKCE
// ==================================================

function selectLesson(lessonNumber) {

  selectedLesson = lessonNumber;

  const wordsForLesson = lessons[lessonNumber];

  if (wordsForLesson.length === 0) {

    alert("Tato lekce zatím nemá žádná slovíčka.");

    return;
  }

  // Počet slov v aktuální lekci
  const wordCount = wordsForLesson.length;


  // ------------------------------
  // KRÁTKÁ HRA
  // ------------------------------

  const shortButton =
    document.getElementById('shortButton');

  if (wordCount >= 5) {

    shortButton.style.display = 'inline-block';

    shortButton.innerText =
      `🟢 Krátká hra – 5 slov`;

  } else {

    shortButton.style.display = 'none';

  }


  // ------------------------------
  // STŘEDNÍ HRA
  // ------------------------------

  const mediumButton =
    document.getElementById('mediumButton');

  if (wordCount >= 10) {

    mediumButton.style.display = 'inline-block';

    mediumButton.innerText =
      `🟡 Střední hra – 10 slov`;

  } else {

    mediumButton.style.display = 'none';

  }


  // ------------------------------
  // CELÁ LEKCE
  // ------------------------------

  const fullButton =
    document.getElementById('fullButton');

  fullButton.innerText =
    `🔴 Celá lekce – ${wordCount} slov`;


  // ------------------------------
  // ZOBRAZENÍ VÝBĚRU DÉLKY
  // ------------------------------

  document.getElementById('lessonSelect').style.display = 'none';

  document.getElementById('setup').style.display = 'block';
}


// ==================================================
// ZPĚT NA VÝBĚR LEKCÍ
// ==================================================

function backToLessons() {

  // Skrytí všech ostatních obrazovek
  document.getElementById('setup').style.display = 'none';

  document.getElementById('game').style.display = 'none';

  document.getElementById('final').style.display = 'none';


  // Zobrazení výběru lekce
  document.getElementById('lessonSelect').style.display = 'block';


  // Reset hry
  selectedLesson = 0;

  selectedWords = [];

  current = {};

  wrongWords = [];

  correct = 0;

  index = 0;

  checked = false;

  target = 0;


  // Reset progress baru
  document.getElementById('progress').style.width = '0%';

  document.getElementById('progressText').innerText = '';

  document.getElementById('czWord').innerText = '';

  document.getElementById('answer').value = '';

  document.getElementById('result').innerText = '';


  // Zastavení výslovnosti
  speechSynthesis.cancel();
}


// ==================================================
// SHUFFLE
// ==================================================

function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
      [array[j], array[i]];
  }

  return array;
}


// ==================================================
// START HRY
// ==================================================

function start(count) {

  const wordsForLesson =
    lessons[selectedLesson];


  const numberOfWords =
    Math.min(count, wordsForLesson.length);


  selectedWords =
    shuffle([...wordsForLesson])
      .slice(0, numberOfWords);


  target = numberOfWords;

  wrongWords = [];

  index = 0;

  correct = 0;

  checked = false;


  document.getElementById('setup').style.display = 'none';

  document.getElementById('game').style.display = 'block';

  document.getElementById('final').style.display = 'none';


  next();
}


// ==================================================
// START CELÉ LEKCE
// ==================================================

function startFullLesson() {

  const wordCount =
    lessons[selectedLesson].length;

  start(wordCount);
}


// ==================================================
// PROGRESS
// ==================================================

function updateUI() {

  document.getElementById('progressText').innerText =
    `${correct} / ${target}`;


  document.getElementById('progress').style.width =
    (correct / target * 100) + '%';
}


// ==================================================
// KONEC HRY
// ==================================================

function finish() {

  document.getElementById('game').style.display = 'none';

  document.getElementById('final').style.display = 'block';


  let text =
    `Well done Teo! Great job! 🎉`;


  document.getElementById('finalText').innerText =
    text;


  speak(text);
}


// ==================================================
// DALŠÍ HRA
// ==================================================

function restart() {

  document.getElementById('final').style.display = 'none';

  document.getElementById('setup').style.display = 'block';
}


// ==================================================
// DALŠÍ SLOVO / KONTROLA ODPOVĚDI
// ==================================================

function next() {

  let input =
    document
      .getElementById('answer')
      .value
      .toLowerCase()
      .trim();


  // ----------------------------------------------
  // KONTROLA ODPOVĚDI
  // ----------------------------------------------

  if (current.en && !checked) {


    if (input === current.en.toLowerCase()) {

      correct++;


      document.getElementById('result').innerHTML =
        `<div class="result-box correct">
          ✔ Správně!
        </div>`;


      wrongWords =
        wrongWords.filter(
          w => w.en !== current.en
        );


      speak(current.en);


    } else {


      document.getElementById('result').innerHTML =
        `<div class="result-box wrong">
          ❌ Správně: ${current.en}
        </div>`;


      if (
        !wrongWords.some(
          w => w.en === current.en
        )
      ) {

        wrongWords.push(current);

      }


      speak(current.en);
    }


    updateUI();

    checked = true;

    return;
  }


  // ----------------------------------------------
  // KONEC SEZNAMU
  // ----------------------------------------------

  if (index >= selectedWords.length) {


    // Opakování chybných slov
    if (wrongWords.length > 0) {

      selectedWords = [...wrongWords];

      index = 0;


    } else {

      finish();

      return;
    }
  }


  // ----------------------------------------------
  // DALŠÍ SLOVO
  // ----------------------------------------------

  current =
    selectedWords[index++];


  document.getElementById('czWord').innerText =
    current.cz;


  document.getElementById('answer').value =
    '';


  document.getElementById('result').innerText =
    '';


  checked = false;


  document.getElementById('answer').focus();
}


// ==================================================
// NÁPOVĚDA
// ==================================================

function hint() {

  let w = current.en;

  if (!w) return;


  document.getElementById('result').innerText =
    w[0] +
    "_".repeat(w.length - 2) +
    w[w.length - 1];
}


// ==================================================
// VÝSLOVNOST
// ==================================================

function speak(text) {

  let u =
    new SpeechSynthesisUtterance(text);


  let v =
    speechSynthesis.getVoices();


  if (v.length === 0) {

    setTimeout(
      () => speak(text),
      200
    );

    return;
  }


  u.voice =
    v.find(
      x => x.lang.includes('en')
    ) || v[0];


  speechSynthesis.cancel();


  setTimeout(() => {

    speechSynthesis.speak(u);

  }, 100);
}


// ==================================================
// ENTER = DALŠÍ
// ==================================================

document
  .getElementById('answer')
  .addEventListener(
    'keydown',
    e => {

      if (e.key === 'Enter') {

        next();

      }

    }
  );


</script>

</body>
</html>
