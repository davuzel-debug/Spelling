<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Angličtina – Spelling</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px 20px;
      background: #ffffff;
      color: #222;
    }

    h1 {
      margin-bottom: 30px;
    }

    h2 {
      margin-bottom: 25px;
    }

    button {
      font-size: 22px;
      padding: 12px 24px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.97);
    }


    /* =========================================
       VÝBĚR LEKCÍ
       ========================================= */

    .lesson-button {
      display: block;
      width: 320px;
      max-width: 90%;
      margin: 14px auto;
      background: #2196f3;
      color: white;
      font-size: 22px;
      padding: 15px;
    }

    .lesson-button small {
      display: block;
      margin-top: 4px;
      font-size: 15px;
      opacity: 0.9;
    }


    /* =========================================
       ALL LEKCE
       ========================================= */

    .all-button {
      background: #f44336;
      color: white;
      margin-top: 25px;
    }

    .all-button small {
      color: white;
    }

    .lesson-separator {
      width: 320px;
      max-width: 90%;
      margin: 25px auto 5px;
      border-top: 2px solid #eeeeee;
    }


    /* =========================================
       VÝBĚR DÉLKY
       ========================================= */

    .btn-green {
      background: #4caf50;
      color: white;
    }

    .btn-yellow {
      background: #ffc107;
      color: #222;
    }

    .btn-red {
      background: #f44336;
      color: white;
    }


    /* =========================================
       TLAČÍTKO ZPĚT
       ========================================= */

    .back-button {
      position: fixed;
      top: 15px;
      left: 15px;

      font-size: 16px;
      padding: 8px 14px;

      background: #eeeeee;
      color: #333;

      border: 1px solid #cccccc;
      border-radius: 6px;

      z-index: 10;
    }

    .back-button:hover {
      background: #dddddd;
    }


    /* =========================================
       HRA
       ========================================= */

    .game-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .progress-wrapper {
      margin: 20px auto 10px;
      width: 80%;
    }

    .bar {
      width: 100%;
      height: 20px;
      background: #eeeeee;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.3s;
    }

    #progressText {
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
    }


    /* =========================================
       SLOVO
       ========================================= */

    .card {
      font-size: 42px;
      font-weight: bold;
      margin: 40px 20px 25px;
    }

    #answer {
      width: 500px;
      max-width: 90%;
      font-size: 32px;
      padding: 12px;
      text-align: center;
      border: 2px solid #cccccc;
      border-radius: 8px;
    }

    #answer:focus {
      outline: none;
      border-color: #2196f3;
    }


    /* =========================================
       HLAVNÍ TLAČÍTKA HRY
       ========================================= */

    .game-buttons {
      margin-top: 15px;
    }

    .check-button {
      background: #2196f3;
      color: white;
      font-size: 24px;
      padding: 14px 35px;
    }

    .next-button {
      background: #4caf50;
      color: white;
      font-size: 24px;
      padding: 14px 35px;
    }

    .secondary-button {
      background: #eeeeee;
      color: #333;
      font-size: 20px;
    }


    /* =========================================
       SÉRIE
       ========================================= */

    #streak {
      font-size: 20px;
      font-weight: bold;
      margin-top: 12px;
      min-height: 28px;
    }

    .streak-hot {
      color: #ff9800;
    }


    /* =========================================
       VÝSLEDEK ODPOVĚDI
       ========================================= */

    .result-box {
      font-size: 28px;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 12px;
      margin: 20px auto;
      display: inline-block;
      min-width: 220px;
    }

    .correct {
      background: #d4ffd4;
      color: green;
    }

    .wrong {
      background: #ffd4d4;
      color: red;
    }


    /* =========================================
       NÁPOVĚDA
       ========================================= */

    #hintText {
      font-size: 26px;
      font-weight: bold;
      margin-top: 15px;
      min-height: 35px;
      letter-spacing: 3px;
    }


    /* =========================================
       FINÁLNÍ OBRAZOVKA
       ========================================= */

    .final-container {
      max-width: 600px;
      margin: 60px auto;
    }

    .final-title {
      font-size: 38px;
      margin-bottom: 30px;
    }

    .final-score {
      font-size: 32px;
      font-weight: bold;
      margin: 20px;
    }

    .final-stat {
      font-size: 22px;
      margin: 12px;
    }

    .final-buttons {
      margin-top: 30px;
    }


    /* =========================================
       MOBIL / TABLET
       ========================================= */

    @media (max-width: 600px) {

      body {
        padding: 70px 12px 20px;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 25px;
      }

      h2 {
        font-size: 24px;
      }

      .lesson-button {
        width: 100%;
        max-width: 400px;
      }

      .card {
        font-size: 36px;
        margin-top: 35px;
      }

      #answer {
        width: 100%;
        max-width: 400px;
        font-size: 28px;
      }

      .progress-wrapper {
        width: 95%;
      }

      button {
        max-width: 95%;
      }

      .check-button,
      .next-button {
        width: 90%;
        max-width: 400px;
      }

      .secondary-button {
        font-size: 18px;
      }

      .result-box {
        font-size: 24px;
        min-width: 0;
        width: 90%;
      }

      .final-title {
        font-size: 32px;
      }

      .final-score {
        font-size: 28px;
      }

      .back-button {
        font-size: 14px;
        padding: 7px 10px;
      }
    }

  </style>
</head>


<body>

<h1>Procvičování angličtiny</h1>


<!-- =========================================
     VÝBĚR LEKCE
     ========================================= -->

<div id="lessonSelect">

  <h2>Vyber spelling lekci</h2>


  <button class="lesson-button" onclick="selectLesson(1)">
    Spelling 1
    <small id="lessonCount1"></small>
  </button>


  <button class="lesson-button" onclick="selectLesson(2)">
    Spelling 2
    <small id="lessonCount2"></small>
  </button>


  <button class="lesson-button" onclick="selectLesson(3)">
    Spelling 3
    <small id="lessonCount3"></small>
  </button>


  <button class="lesson-button" onclick="selectLesson(4)">
    Spelling 4
    <small id="lessonCount4"></small>
  </button>


  <button class="lesson-button" onclick="selectLesson(5)">
    Spelling 5
    <small id="lessonCount5"></small>
  </button>


  <!-- -----------------------------------------
       ODDĚLOVAČ
       ----------------------------------------- -->

  <div class="lesson-separator"></div>


  <!-- -----------------------------------------
       ALL
       ----------------------------------------- -->

  <button
    class="lesson-button all-button"
    onclick="selectLesson('all')">

    ALL

    <small id="allLessonCount"></small>

  </button>

</div>


<!-- =========================================
     VÝBĚR DÉLKY HRY
     ========================================= -->

<div id="setup" style="display:none;">

  <button class="back-button" onclick="backToLessons()">
    ← Zpět na výběr lekce
  </button>


  <h2 id="setupTitle">
    Jak dlouhou chceš hru?
  </h2>


  <!-- BĚŽNÁ LEKCE -->

  <div id="normalLevels">

    <button
      id="shortButton"
      class="btn-green"
      onclick="start(5)">

      🟢 Krátká hra – 5 slov

    </button>

    <br>


    <button
      id="mediumButton"
      class="btn-yellow"
      onclick="start(10)">

      🟡 Střední hra – 10 slov

    </button>

    <br>

  </div>


  <!-- ALL LEKCE -->

  <div id="allLevels" style="display:none;">

    <button
      id="allThirdButton"
      class="btn-green"
      onclick="startAllByPercentage(1/3)">

      🟢 1. třetina

    </button>

    <br>


    <button
      id="allTwoThirdButton"
      class="btn-yellow"
      onclick="startAllByPercentage(2/3)">

      🟡 2. třetiny

    </button>

    <br>


    <button
      id="allFullButton"
      class="btn-red"
      onclick="startAllByPercentage(1)">

      🔴 Všechna slovíčka

    </button>

  </div>


  <!-- CELÁ BĚŽNÁ LEKCE -->

  <button
    id="fullButton"
    class="btn-red"
    onclick="startFullLesson()">

    🔴 Celá lekce

  </button>

</div>


<!-- =========================================
     HRA
     ========================================= -->

<div id="game" style="display:none;">

  <button class="back-button" onclick="backToLessons()">
    ← Zpět na výběr lekce
  </button>


  <div class="game-container">

    <div class="progress-wrapper">

      <div class="bar">

        <div
          class="bar-fill"
          id="progress">
        </div>

      </div>


      <div id="progressText"></div>

    </div>


    <div
      class="card"
      id="czWord">
    </div>


    <input
      type="text"
      id="answer"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    >


    <div class="game-buttons">

      <button
        id="checkButton"
        class="check-button"
        onclick="next()">

        Zkontrolovat

      </button>


      <button
        id="nextButton"
        class="next-button"
        onclick="next()"
        style="display:none;">

        Další →

      </button>


      <br>


      <button
        class="secondary-button"
        onclick="hint()">

        💡 Nápověda

      </button>


      <button
        class="secondary-button"
        onclick="speak(current.en)">

        🔊

      </button>

    </div>


    <div id="streak"></div>

    <div id="result"></div>

    <div id="hintText"></div>

  </div>

</div>


<!-- =========================================
     KONEC HRY
     ========================================= -->

<div id="final" style="display:none;">

  <button class="back-button" onclick="backToLessons()">
    ← Zpět na výběr lekce
  </button>


  <div class="final-container">

    <div class="final-title">
      🎉 GREAT JOB, TEO!
    </div>


    <div
      class="final-score"
      id="finalScore">
    </div>


    <div
      class="final-stat"
      id="finalStreak">
    </div>


    <div
      class="final-stat"
      id="finalMistakes">
    </div>


    <div
      class="final-stat"
      id="finalHints">
    </div>


    <div class="final-buttons">

      <button
        class="btn-green"
        onclick="restart()">

        🔄 Zkusit znovu

      </button>


      <br>


      <button
        class="secondary-button"
        onclick="backToLessons()">

        📚 Vybrat jinou lekci

      </button>

    </div>

  </div>

</div>


<script>


// ==================================================
// 📚 BĚŽNÉ SPELLING LEKCE
// ==================================================

const lessons = {

  1: [
    {cz:"mléko", en:"milk"},
    {cz:"hedvábí", en:"silk"},
    {cz:"pásek", en:"belt"},
    {cz:"roztát", en:"melt"},
    {cz:"zlato", en:"gold"},
    {cz:"řekl", en:"told"},
    {cz:"studený", en:"cold"},
    {cz:"pomoc", en:"help"},
    {cz:"chaluhy", en:"kelp"},
    {cz:"hlt", en:"gulp"}
  ],

  2: [],

  3: [],

  4: [],

  5: []

};


// ==================================================
// ALL – VŠECHNA SLOVÍČKA
// ==================================================

let allWords = [];


// Vytvoří ALL ze všech běžných lekcí
function buildAllWords() {

  allWords = [];

  for (let i = 1; i <= 5; i++) {

    allWords =
      allWords.concat(lessons[i]);

  }
}


// ==================================================
// PROMĚNNÉ
// ==================================================

let selectedLesson = 0;

let selectedWords = [];

let current = {};

let wrongWords = [];

let correct = 0;

let index = 0;

let checked = false;

let target = 0;

let streak = 0;

let maxStreak = 0;

let mistakeCount = 0;

let hintCount = 0;

let currentHintLevel = 0;


// ==================================================
// POČET SLOV U LEKCÍ
// ==================================================

function updateLessonCounts() {

  for (let i = 1; i <= 5; i++) {

    const countElement =
      document.getElementById(
        `lessonCount${i}`
      );

    const count =
      lessons[i].length;


    if (count > 0) {

      countElement.innerText =
        `${count} slov`;

    } else {

      countElement.innerText =
        `zatím bez slov`;
    }
  }


  // Aktualizace ALL

  buildAllWords();


  const allCount =
    allWords.length;


  document
    .getElementById('allLessonCount')
    .innerText =
      `${allCount} slov`;
}


// ==================================================
// VÝBĚR LEKCE
// ==================================================

function selectLesson(lessonNumber) {

  selectedLesson =
    lessonNumber;


  // ----------------------------------------------
  // ALL
  // ----------------------------------------------

  if (lessonNumber === 'all') {

    buildAllWords();


    if (allWords.length === 0) {

      alert(
        "Zatím nejsou přidána žádná slovíčka."
      );

      return;
    }


    const wordCount =
      allWords.length;


    document
      .getElementById('setupTitle')
      .innerText =
        "Jak velkou část chceš procvičit?";


    // Skryjeme běžné úrovně

    document
      .getElementById('normalLevels')
      .style.display = 'none';


    // Zobrazíme ALL úrovně

    document
      .getElementById('allLevels')
      .style.display = 'block';


    // Počet slov

    const firstThird =
      Math.max(
        1,
        Math.ceil(wordCount / 3)
      );


    const twoThirds =
      Math.max(
        1,
        Math.ceil(wordCount * 2 / 3)
      );


    document
      .getElementById('allThirdButton')
      .innerText =
        `🟢 1. třetina – ${firstThird} slov`;


    document
      .getElementById('allTwoThirdButton')
      .innerText =
        `🟡 2. třetiny – ${twoThirds} slov`;


    document
      .getElementById('allFullButton')
      .innerText =
        `🔴 Všechna slovíčka – ${wordCount} slov`;


    // Zobrazení

    document
      .getElementById('lessonSelect')
      .style.display = 'none';


    document
      .getElementById('setup')
      .style.display = 'block';


    return;
  }


  // ----------------------------------------------
  // BĚŽNÁ LEKCE
  // ----------------------------------------------

  const wordsForLesson =
    lessons[lessonNumber];


  if (wordsForLesson.length === 0) {

    alert(
      "Tato lekce zatím nemá žádná slovíčka."
    );

    return;
  }


  const wordCount =
    wordsForLesson.length;


  // Zobrazíme běžné úrovně

  document
    .getElementById('normalLevels')
    .style.display = 'block';


  document
    .getElementById('allLevels')
    .style.display = 'none';


  document
    .getElementById('setupTitle')
    .innerText =
      "Jak dlouhou chceš hru?";


  // ----------------------------------------------
  // KRÁTKÁ HRA
  // ----------------------------------------------

  const shortButton =
    document.getElementById(
      'shortButton'
    );


  if (wordCount >= 6) {

    shortButton.style.display =
      'inline-block';

    shortButton.innerText =
      '🟢 Krátká hra – 5 slov';

  } else {

    shortButton.style.display =
      'none';
  }


  // ----------------------------------------------
  // STŘEDNÍ HRA
  // ----------------------------------------------

  const mediumButton =
    document.getElementById(
      'mediumButton'
    );


  if (wordCount >= 11) {

    mediumButton.style.display =
      'inline-block';

    mediumButton.innerText =
      '🟡 Střední hra – 10 slov';

  } else {

    mediumButton.style.display =
      'none';
  }


  // ----------------------------------------------
  // CELÁ LEKCE
  // ----------------------------------------------

  const fullButton =
    document.getElementById(
      'fullButton'
    );


  fullButton.innerText =
    `🔴 Celá lekce – ${wordCount} slov`;


  fullButton.style.display =
    'inline-block';


  // Zobrazení

  document
    .getElementById('lessonSelect')
    .style.display = 'none';


  document
    .getElementById('setup')
    .style.display = 'block';
}


// ==================================================
// ZPĚT NA VÝBĚR LEKCÍ
// ==================================================

function backToLessons() {

  document
    .getElementById('setup')
    .style.display = 'none';


  document
    .getElementById('game')
    .style.display = 'none';


  document
    .getElementById('final')
    .style.display = 'none';


  document
    .getElementById('lessonSelect')
    .style.display = 'block';


  // Reset hry

  selectedLesson = 0;

  selectedWords = [];

  current = {};

  wrongWords = [];

  correct = 0;

  index = 0;

  checked = false;

  target = 0;

  streak = 0;

  maxStreak = 0;

  mistakeCount = 0;

  hintCount = 0;

  currentHintLevel = 0;


  // Reset UI

  document
    .getElementById('progress')
    .style.width = '0%';


  document
    .getElementById('progressText')
    .innerText = '';


  document
    .getElementById('czWord')
    .innerText = '';


  document
    .getElementById('answer')
    .value = '';


  document
    .getElementById('result')
    .innerText = '';


  document
    .getElementById('hintText')
    .innerText = '';


  document
    .getElementById('streak')
    .innerText = '';


  // Vrátíme výběr úrovní do výchozího stavu

  document
    .getElementById('normalLevels')
    .style.display = 'block';


  document
    .getElementById('allLevels')
    .style.display = 'none';


  document
    .getElementById('setupTitle')
    .innerText =
      "Jak dlouhou chceš hru?";


  speechSynthesis.cancel();
}


// ==================================================
// SHUFFLE
// ==================================================

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [array[i], array[j]] =
      [array[j], array[i]];
  }


  return array;
}


// ==================================================
// START HRY
// ==================================================

function start(count) {

  const wordsForLesson =
    selectedLesson === 'all'
      ? allWords
      : lessons[selectedLesson];


  const numberOfWords =
    Math.min(
      count,
      wordsForLesson.length
    );


  selectedWords =
    shuffle([...wordsForLesson])
      .slice(
        0,
        numberOfWords
      );


  target = numberOfWords;

  wrongWords = [];

  index = 0;

  correct = 0;

  checked = false;

  streak = 0;

  maxStreak = 0;

  mistakeCount = 0;

  hintCount = 0;

  currentHintLevel = 0;


  document
    .getElementById('setup')
    .style.display = 'none';


  document
    .getElementById('game')
    .style.display = 'block';


  document
    .getElementById('final')
    .style.display = 'none';


  updateUI();

  next();
}


// ==================================================
// START ALL PODLE PROCENT
// ==================================================

function startAllByPercentage(percentage) {

  buildAllWords();


  const wordCount =
    allWords.length;


  let numberOfWords =
    Math.ceil(
      wordCount * percentage
    );


  numberOfWords =
    Math.max(
      1,
      numberOfWords
    );


  start(numberOfWords);
}


// ==================================================
// START CELÉ LEKCE
// ==================================================

function startFullLesson() {

  const wordCount =
    lessons[selectedLesson].length;


  start(wordCount);
}


// ==================================================
// PROGRESS
// ==================================================

function updateUI() {

  document
    .getElementById('progressText')
    .innerText =
      `${correct} / ${target}`;


  document
    .getElementById('progress')
    .style.width =
      (correct / target * 100) + '%';
}


// ==================================================
// KONTROLA ODPOVĚDI
// ==================================================

function checkAnswer() {

  const input =
    document
      .getElementById('answer')
      .value
      .toLowerCase()
      .trim();


  if (
    input === current.en.toLowerCase()
  ) {

    correct++;

    streak++;


    if (streak > maxStreak) {

      maxStreak = streak;
    }


    document
      .getElementById('result')
      .innerHTML =
        `<div class="result-box correct">
          ✔ Správně!
        </div>`;


    wrongWords =
      wrongWords.filter(
        w => w.en !== current.en
      );


    const streakElement =
      document.getElementById(
        'streak'
      );


    if (streak >= 3) {

      streakElement.innerHTML =
        `<span class="streak-hot">
          🔥 ${streak} správně za sebou!
        </span>`;

    } else {

      streakElement.innerText = '';
    }


    speak(current.en);


  } else {

    mistakeCount++;

    streak = 0;


    document
      .getElementById('result')
      .innerHTML =
        `<div class="result-box wrong">
          ❌ Správně: ${current.en}
        </div>`;


    if (
      !wrongWords.some(
        w => w.en === current.en
      )
    ) {

      wrongWords.push(current);
    }


    document
      .getElementById('streak')
      .innerText = '';


    speak(current.en);
  }


  updateUI();

  checked = true;


  document
    .getElementById('checkButton')
    .style.display = 'none';


  document
    .getElementById('nextButton')
    .style.display = 'inline-block';


  document
    .getElementById('answer')
    .blur();
}


// ==================================================
// DALŠÍ SLOVO
// ==================================================

function next() {

  if (
    current.en &&
    !checked
  ) {

    checkAnswer();

    return;
  }


  // ----------------------------------------------
  // KONEC SEZNAMU
  // ----------------------------------------------

  if (
    index >= selectedWords.length
  ) {

    if (wrongWords.length > 0) {

      selectedWords =
        [...wrongWords];

      index = 0;

    } else {

      finish();

      return;
    }
  }


  // ----------------------------------------------
  // DALŠÍ SLOVO
  // ----------------------------------------------

  current =
    selectedWords[index++];


  document
    .getElementById('czWord')
    .innerText =
      current.cz;


  document
    .getElementById('answer')
    .value = '';


  document
    .getElementById('result')
    .innerText = '';


  document
    .getElementById('hintText')
    .innerText = '';


  currentHintLevel = 0;

  checked = false;


  document
    .getElementById('checkButton')
    .style.display =
      'inline-block';


  document
    .getElementById('nextButton')
    .style.display =
      'none';


  document
    .getElementById('answer')
    .focus();
}


// ==================================================
// NÁPOVĚDA
// ==================================================

function hint() {

  const word =
    current.en;


  if (!word) return;


  hintCount++;


  if (currentHintLevel === 0) {

    currentHintLevel = 2;

  } else {

    currentHintLevel++;
  }


  if (
    currentHintLevel >= word.length
  ) {

    currentHintLevel =
      word.length - 1;
  }


  let visible = '';


  for (
    let i = 0;
    i < word.length;
    i++
  ) {

    if (
      i === 0 ||
      i === word.length - 1 ||
      i < currentHintLevel
    ) {

      visible += word[i];

    } else {

      visible += '_';
    }
  }


  document
    .getElementById('hintText')
    .innerText =
      visible;
}


// ==================================================
// VÝSLOVNOST
// ==================================================

function speak(text) {

  let u =
    new SpeechSynthesisUtterance(text);


  let voices =
    speechSynthesis.getVoices();


  if (voices.length === 0) {

    setTimeout(
      () => speak(text),
      200
    );

    return;
  }


  u.voice =
    voices.find(
      x => x.lang.includes('en')
    ) || voices[0];


  speechSynthesis.cancel();


  setTimeout(
    () => speechSynthesis.speak(u),
    100
  );
}


// ==================================================
// KONEC HRY
// ==================================================

function finish() {

  document
    .getElementById('game')
    .style.display = 'none';


  document
    .getElementById('final')
    .style.display = 'block';


  document
    .getElementById('finalScore')
    .innerText =
      `${correct} / ${target} slov zvládnuto`;


  document
    .getElementById('finalStreak')
    .innerText =
      `🔥 Nejlepší série: ${maxStreak} správně za sebou`;


  document
    .getElementById('finalMistakes')
    .innerText =
      `🔁 Chybné pokusy: ${mistakeCount}`;


  document
    .getElementById('finalHints')
    .innerText =
      `💡 Použitá nápověda: ${hintCount}×`;


  speak(
    'Well done Teo! Great job!'
  );
}


// ==================================================
// ZKUSIT ZNOVU
// ==================================================

function restart() {

  document
    .getElementById('final')
    .style.display = 'none';


  document
    .getElementById('setup')
    .style.display = 'block';


  if (selectedLesson === 'all') {

    selectLesson('all');

  } else {

    selectLesson(selectedLesson);
  }
}


// ==================================================
// ENTER = KONTROLA / DALŠÍ
// ==================================================

document
  .getElementById('answer')
  .addEventListener(
    'keydown',
    e => {

      if (e.key === 'Enter') {

        next();
      }

    }
  );


// ==================================================
// INICIALIZACE
// ==================================================

updateLessonCounts();

</script>
